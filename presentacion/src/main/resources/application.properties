spring.application.name=apicalendariolaboral
server.port=8081

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/calendariolaboral
spring.datasource.username=postgres
spring.datasource.password=sa

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Crea/actualiza las tablas (agrega la columna 'descripcion' si no existe)
spring.jpa.hibernate.ddl-auto=update

# URL base de la API de festivos
servicio-externo.festivos.url=${FESTIVOS_API_URL:http://localhost:3030/api/festivos}
